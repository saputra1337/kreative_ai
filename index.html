<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreative AI - Foto Studio Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="__loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#eee;font-family:system-ui,sans-serif;font-size:14px;z-index:9999;">
        <div style="text-align:center">
            <div style="width:32px;height:32px;border:3px solid #333;border-top-color:#ea580c;border-radius:50%;animation:__spin 0.8s linear infinite;margin:0 auto 12px"></div>
            Memuat aplikasi...
        </div>
    </div>
    <style>@keyframes __spin{to{transform:rotate(360deg)}}</style>
    <script>const apiKey = "";</script>
    <script>
        // Local loader - load from same directory
        (async function() {
            try {
                // Load body HTML
                const bodyRes = await fetch('./body.html');
                const bodyHtml = await bodyRes.text();
                
                // Remove loader
                const loader = document.getElementById('__loader');
                if (loader) loader.remove();
                
                // Insert body
                document.body.insertAdjacentHTML('afterbegin', bodyHtml);
                
                // Load scripts in order
                function loadScript(src, isModule) {
                    return new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = src;
                        if (isModule) script.type = 'module';
                        script.onload = resolve;
                        script.onerror = reject;
                        document.body.appendChild(script);
                    });
                }
                
                await loadScript('./bundle-classic.js', false);
                await loadScript('./bundle-module.js', true);
                
                console.log('[local-boot] OK');
            } catch (err) {
                console.error('[local-boot] Error:', err);
                document.body.innerHTML = '<div style="padding:24px;color:#fff;background:#3a0a0a;font-family:system-ui;"><h2>Boot error</h2><pre>' + err.message + '</pre></div>';
            }
        })();
    </script>
</body>
</html>
